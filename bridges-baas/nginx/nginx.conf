# Bridges-as-a-Service Nginx Configuration
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=matrix:10m rate=50r/s;

    # Upstream servers
    upstream synapse {
        server synapse:8008;
    }

    upstream api {
        server api:3000;
    }

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Matrix homeserver
    server {
        listen 443 ssl http2;
        server_name matrix.yourdomain.com;  # CHANGE THIS

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Matrix client-server API
        location ~ ^(/_matrix|/_synapse/client) {
            limit_req zone=matrix burst=50 nodelay;

            proxy_pass http://synapse;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            # Synapse responses can be slow
            proxy_read_timeout 600s;

            # WebSocket support for sync
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Synapse admin API (restricted)
        location /_synapse/admin {
            # Only allow from internal network
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://synapse;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        # Well-known for federation
        location /.well-known/matrix/server {
            return 200 '{"m.server": "matrix.yourdomain.com:443"}';
            add_header Content-Type application/json;
        }

        location /.well-known/matrix/client {
            return 200 '{"m.homeserver": {"base_url": "https://matrix.yourdomain.com"}}';
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
        }
    }

    # API server
    server {
        listen 443 ssl http2;
        server_name api.yourdomain.com;  # CHANGE THIS

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://api;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }

        # Webhooks (no rate limit for Stripe, etc)
        location /webhooks {
            proxy_pass http://api;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }
    }

    # Federation port (optional)
    server {
        listen 8448 ssl http2;
        server_name matrix.yourdomain.com;  # CHANGE THIS

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            proxy_pass http://synapse;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
        }
    }
}
